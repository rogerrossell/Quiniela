<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiniela · Previsió i seguiment</title><meta name="description" content="Previsions de la lliga, seguiment d’encerts i evolució del model jornada a jornada."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23102621'/%3E%3Ctext x='8' y='29' fill='%23d5fa62' font-size='27' font-family='Arial'%3EQ%3C/text%3E%3C/svg%3E"><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#18342d;background:#f3f5f4;font-size:16px;line-height:1.5;--green:#173e32;--lime:#d5fa62;--muted:#52675f}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button,a,select{touch-action:manipulation}a{color:#246a50}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #b66316;outline-offset:4px}header{background:#102b23;color:white;padding:25px max(5vw,20px);display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:1.5rem;font-weight:800;letter-spacing:-1px}.brand b{color:var(--lime)}header span{font-size:.9rem;color:#c2d6cd}main{max-width:1240px;margin:auto;padding:32px 24px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;color:var(--muted);font-weight:bold}h1{font-size:2.3rem;letter-spacing:-1.3px;margin:6px 0}h2{font-size:1.3rem;margin:0 0 10px}h3{font-size:1.05rem}p{margin:8px 0 16px}.sub{color:var(--muted)}select{padding:11px;border:1px solid #b8c9c0;border-radius:8px;background:white;max-width:100%}.tag{display:inline-block;border:1px solid #acbfb6;border-radius:5px;padding:4px 8px;font-size:.85rem}.nav{display:flex;gap:26px;border-bottom:1px solid #c4d2cb;margin:24px 0}.nav button{border:0;background:none;padding:14px 2px;cursor:pointer;color:#50675d}.nav button[aria-selected=true]{color:#173e32;border-bottom:3px solid #173e32;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{background:white;border:1px solid #d7e1dc;border-radius:10px;padding:20px}.stat strong{display:block;font-size:1.8rem;line-height:1.3}.stat span{font-size:.9rem;color:var(--muted)}.note{border-left:4px solid #80a938;background:#eaf0df;padding:14px 18px;margin:18px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}.panel{background:white;border:1px solid #d7e1dc;border-radius:12px;padding:23px}.matches{padding:0;overflow:hidden}.match{padding:22px;border-bottom:1px solid #e2e9e5}.match:last-child{border:0}.match-top{display:flex;justify-content:space-between;gap:15px}.match h3{margin:4px 0 12px;font-size:1.1rem}.meta{font-size:.85rem;color:var(--muted)}.sign{display:grid;place-content:center;background:#163c31;color:#e4ff93;border-radius:8px;min-width:46px;height:46px;font-size:1.4rem;font-weight:bold}.prob{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.prob span{background:#eff3f0;border-radius:5px;padding:7px 10px;font-size:.9rem;display:flex;justify-content:space-between}.prob .best{background:#d7f3a6}.bar{display:flex;height:6px;border-radius:10px;overflow:hidden;gap:2px}.bar i:nth-child(1){background:#236347}.bar i:nth-child(2){background:#9dbaab}.bar i:nth-child(3){background:#8da239}details{font-size:.9rem;margin-top:14px}summary{cursor:pointer;color:#245e45;padding:4px 0}details p{color:#4f635b}.side-block{margin-bottom:22px}.pill{font-size:.85rem;background:#eef3ef;padding:6px 8px;border-radius:5px;display:inline-block}.step{border-left:2px solid #bbcebe;padding:0 0 20px 17px}.step b{display:block}.step small{color:var(--muted);font-size:.875rem}.external{display:block;background:#173e32;color:white;text-decoration:none;padding:12px;text-align:center;border-radius:7px;margin-top:16px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.95rem}th,td{text-align:left;border-bottom:1px solid #dce5df;padding:13px 10px}th{font-size:.85rem;color:#4e6559}td:first-child{min-width:220px}.empty{padding:28px;background:#eff3f0;border-radius:8px;color:#50675d}.audit-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.footer{margin-top:30px;padding-top:20px;border-top:1px solid #c4d2cb;font-size:.85rem;color:var(--muted)}[hidden]{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.aside{display:grid;grid-template-columns:1fr 1fr;gap:15px}.aside .panel{margin:0}}@media(max-width:600px){header{align-items:start;flex-direction:column;gap:3px}main{padding:23px 16px}.top{align-items:start;flex-direction:column}h1{font-size:1.9rem}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:1.45rem}.stat span{font-size:.8rem}.aside,.audit-grid{grid-template-columns:1fr}.panel{padding:18px}.match{padding:18px}.prob span{padding:6px}.nav{gap:18px}}@media print{header,.nav,button,.external,select{display:none}main{padding:0}[role=tabpanel][hidden]{display:block!important}.layout{display:block}.aside{display:none}.panel{break-inside:avoid}body{background:white}}
</style></head><body><header><div class="brand">Q<b>.</b> Quiniela</div><span>Previsió · Resultats · Aprenentatge</span></header><main><div class="top"><div><div class="eyebrow">Lliga EA Sports · 2026/27</div><h1>El quadern de cada jornada</h1><div class="sub" id="period"></div></div><label>Jornada<br><select id="round" aria-label="Selecciona la jornada"></select></label></div><nav class="nav" role="tablist" aria-label="Apartats"><button role="tab" id="tab-pre" aria-selected="true" aria-controls="pre">Previsió</button><button role="tab" id="tab-track" aria-selected="false" aria-controls="track" tabindex="-1">Seguiment</button><a href="programacio.html" style="padding:14px 2px;text-decoration:none;color:#245e45">Programació</a></nav><section id="pre" role="tabpanel" aria-labelledby="tab-pre"></section><section id="track" role="tabpanel" aria-labelledby="tab-track" hidden></section><footer class="footer">Probabilitats experimentals. Cap garantia d’encert. Les previsions originals es conserven per avaluar-les sense canvis retrospectius. <span id="updated"></span></footer></main>
<script id="data" type="application/json">__DATA__</script><script>
const db=JSON.parse(document.getElementById('data').textContent);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>new Intl.DateTimeFormat('ca-ES',{dateStyle:'short',timeStyle:'short',timeZone:'Europe/Madrid'}).format(new Date(s));
$('#round').innerHTML=db.rounds.map((r,i)=>`<option value="${i}">Jornada ${r.number} · ${esc(r.label)}</option>`).join('');
function outcome(m){if(!m.result||m.status!=='final')return 'Pendent';const [a,b]=m.result;return a>b?'1':a<b?'2':'X'}

function renderCoupon(r){
const c=r.coupon;if(!c)return '';const pct=p=>new Intl.NumberFormat('ca-ES',{maximumSignificantDigits:3}).format(p*100)+'%';
if(!c.columns.length)return '<div class="panel"><h2>Les teves 4 apostes</h2><p>Encara no hi ha probabilitats verificades per generar-les.</p></div>';
return `<div class="panel" style="margin:20px 0"><div class="match-top"><h2>${c.complete?'Les teves 4 apostes':'4 combinacions parcials'}</h2><span class="tag">${c.complete?'Cupó complet':'Cupó incomplet'}</span></div><p>${c.complete?'Quatre columnes diferents, ordenades per probabilitat estimada de 14 encerts.':'Només cobreixen els '+c.matches.length+' partits amb previsió. No són quatre apostes completes de la Quiniela.'}</p><div class="table-wrap"><table><caption class="meta" style="text-align:left">${c.complete?'Ordre del cupó oficial':'Ordre de la previsió parcial'} · 1: local · X: empat · 2: visitant</caption><thead><tr><th scope="col">Partit</th>${c.columns.map((_,i)=>`<th scope="col">Aposta ${i+1}</th>`).join('')}</tr></thead><tbody>${c.matches.map((m,i)=>`<tr><td>${i+1}. ${esc(m.home)} – ${esc(m.away)}</td>${c.columns.map(col=>`<td><b>${col.signs[i]}</b></td>`).join('')}</tr>`).join('')}${c.complete?`<tr><td>Ple al 15 · ${esc(c.pleno15.home)} – ${esc(c.pleno15.away)}</td>${c.columns.map(()=>`<td>${esc(c.pleno15.score)}</td>`).join('')}</tr>`:''}<tr><td>Probabilitat de ${c.matches.length} encerts</td>${c.columns.map(col=>`<td>${pct(col.probability)}</td>`).join('')}</tr></tbody></table></div><p style="margin-top:16px"><b>Probabilitat conjunta de ${c.matches.length} encerts: ${pct(c.coverage)}</b></p><p class="meta">Càlcul amb les probabilitats originals, assumint independència entre partits. Maximitza l’encert de tots els signes; no la probabilitat de qualsevol premi ni la rendibilitat. Model experimental, sense garantia d’encert.</p>${c.complete?`<p class="meta">Ple al 15: marcador 0/1/2/M (M = 3 o més gols), el més probable segons el model. El percentatge de 14 encerts no inclou el Ple al 15. Tancament: ${date(c.deadline)}. <a href="${esc(c.source)}" target="_blank" rel="noopener">Cupó verificat</a></p>`:`<p class="note">${esc(c.reason)} No emplenis un cupó oficial amb aquesta taula parcial.</p>`}<p class="meta">Probabilitats de la previsió del ${date(c.generated_from)}. Les combinacions es generen automàticament en preparar cada jornada i es conserven en revisar els resultats.</p></div>`;
}

function render(){const r=db.rounds[+$('#round').value],ms=r.matches.filter(m=>m.forecast),t=r.metrics;$('#period').textContent=r.period;$('#updated').textContent='Darrera actualització: '+date(db.updated);const match=m=>{const p=m.forecast.percentages;return `<article class="match"><div class="match-top"><div><div class="meta">${date(m.kickoff)}</div><h3>${esc(m.home)} – ${esc(m.away)}</h3></div><div class="sign" aria-label="Signe recomanat ${m.forecast.sign}">${m.forecast.sign}</div></div><div class="prob">${['1','X','2'].map(s=>`<span class="${s===m.forecast.sign?'best':''}">${s}<b>${p[s]}%</b></span>`).join('')}</div><div class="bar" aria-hidden="true">${['1','X','2'].map(s=>`<i style="width:${p[s]}%"></i>`).join('')}</div><div class="meta" style="margin-top:10px">Marcadors: ${m.forecast.top_scores.map(x=>esc(x.score)).join(' · ')} · ${esc(m.confidence)}</div><details><summary>Factors i fonts</summary><p>${esc(m.note)}</p>${m.sources.map((s,i)=>`<a href="${esc(s)}" target="_blank" rel="noopener">Font ${i+1}</a>`).join(' · ')}</details></article>`};
$('#pre').innerHTML=`${renderCoupon(r)}<div class="stats"><div class="stat"><strong>${ms.length}</strong><span>Partits amb previsió</span></div><div class="stat"><strong>${esc(r.model)}</strong><span>Versió congelada</span></div><div class="stat"><strong>${r.matches.length-ms.length}</strong><span>Partits fora d’avaluació</span></div></div><div class="note">${esc(r.warning)}</div><div class="layout"><div><div style="display:flex;justify-content:space-between;gap:15px;margin-bottom:14px"><h2>Pronòstics 1 · X · 2</h2><span class="tag">${esc(r.label)}</span></div><div class="panel matches">${ms.map(match).join('')}</div><p class="meta" style="margin-top:15px">Previsió emesa: ${date(r.forecast_at)}. Un marcador d’empat pot ser el més probable encara que el signe sigui 1: el signe suma totes les victòries possibles.</p></div><aside class="aside"><div class="panel side-block"><h2>El cicle de la jornada</h2><div class="step"><b>Dos dies abans · 10:00</b><small>Nova tasca, fonts actualitzades i previsió.</small></div><div class="step"><b>Durant la jornada</b><small>La previsió original queda congelada.</small></div><div class="step"><b>L’endemà del final · 10:00</b><small>Encerts, errors i revisió del model.</small></div><p class="meta">Hora de Madrid. ${esc(db.automation_note)}</p></div><div class="panel"><h2>Què inclou el model</h2><p>Gols, rendiment a casa i fora, i ajustos prudents per baixes i descans.</p><p class="meta">Encara sense calibratge històric, xG ni model individual dels golejadors.</p></div></aside></div>`;
const fmt=n=>n==null?'—':n.toFixed(3);$('#track').innerHTML=`<div class="stats"><div class="stat"><strong>${t.n?t.hits+' / '+t.n:'—'}</strong><span>Encerts de signe</span></div><div class="stat"><strong>${t.accuracy==null?'—':Math.round(t.accuracy*100)+'%'}</strong><span>Taxa d’encert</span></div><div class="stat"><strong>${t.n} / ${ms.length}</strong><span>Partits avaluats</span></div></div><div class="panel"><h2>Previsió contra resultat</h2><p class="sub">Només compten partits amb previsió publicada abans de començar i resultat final verificat.</p><div class="table-wrap"><table><thead><tr><th>Partit</th><th>Previsió</th><th>Resultat</th><th>Avaluació</th></tr></thead><tbody>${r.matches.map(m=>{let o=outcome(m);return `<tr><td>${esc(m.home)} – ${esc(m.away)}</td><td>${m.forecast?m.forecast.sign:'—'}</td><td>${m.result?m.result.join('–'):'Pendent'}</td><td>${!m.forecast?'Exclòs · sense previsió':o==='Pendent'?'Pendent':o===m.forecast.sign?'Encert':'Error'}</td></tr>`}).join('')}</tbody></table></div></div><div class="audit-grid"><div class="panel"><h2>Qualitat de les probabilitats</h2><p>Brier: <b>${fmt(t.brier)}</b> · Pèrdua logarítmica: <b>${fmt(t.logloss)}</b></p><p class="meta">Valors més baixos són millors. Brier multicategoria, escala 0–2. Amb pocs partits encara no es pot concloure que una versió sigui millor.</p></div><div class="panel"><h2>Revisió de la jornada</h2><p>${esc(r.review.summary)}</p><p class="meta">${esc(r.review.next)}</p></div></div><div class="panel" style="margin-top:22px"><h2>Registre de millores</h2>${r.review.changes.length?r.review.changes.map(c=>`<p>${esc(c)}</p>`).join(''):'<div class="empty">Encara no hi ha canvis validats. Es documentaran la hipòtesi, les proves i la decisió abans d’aplicar una nova versió.</div>'}</div>`;
}
$('#round').addEventListener('change',render);const tabs=[...document.querySelectorAll('[role=tab]')];function selectTab(i){history.replaceState(null,'',i===1?'#track':'#pre');tabs.forEach((b,j)=>{b.setAttribute('aria-selected',j===i);b.tabIndex=j===i?0:-1;$('#'+b.getAttribute('aria-controls')).hidden=j!==i})}tabs.forEach((b,i)=>{b.addEventListener('click',()=>selectTab(i));b.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let j=e.key==='Home'?0:e.key==='End'?1:1-i;selectTab(j);tabs[j].focus()}})});render();selectTab(location.hash==='#track'?1:0);
</script></body></html>
