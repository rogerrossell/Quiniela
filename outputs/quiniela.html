if(!c.columns.length)return '<div class="panel"><h2>Les teves 4 apostes</h2><p>Encara no hi ha probabilitats verificades per generar-les.</p></div>';
return `<div class="panel" style="margin:20px 0"><div class="match-top"><h2>${c.complete?'Les teves 4 apostes':'4 combinacions parcials'}</h2><span class="tag">${c.complete?'SELAE · jornada '+r.official_coupon.number:'Cupó incomplet'}</span></div><p>${c.complete?'Quatre columnes diferents, ordenades per probabilitat estimada de 14 encerts. El cupó inclou 8 partits de Primera i 6 de Segona.':'Només cobreixen els '+c.matches.length+' partits amb previsió. No són quatre apostes completes de la Quiniela.'}</p><div class="table-wrap"><table><caption class="meta" style="text-align:left">${c.complete?'Ordre del cupó oficial':'Ordre de la previsió parcial'} · 1: local · X: empat · 2: visitant · Desplaça la taula lateralment per veure totes les columnes.</caption><thead><tr><th scope="col">Partit</th>${c.columns.map((_,i)=>`<th scope="col">Aposta ${i+1}</th>`).join('')}<th scope="col">Condensació</th></tr></thead><tbody>${c.matches.map((m,i)=>`<tr><td>${i+1}. ${esc(m.home)} – ${esc(m.away)}</td>${c.columns.map(col=>`<td><b>${col.signs[i]}</b></td>`).join('')}<td><b>${d.signs[i]}</b></td></tr>`).join('')}${c.complete?`<tr><td>Ple al 15 · ${esc(c.pleno15.home)} – ${esc(c.pleno15.away)}</td>${c.columns.map(()=>`<td>${esc(c.pleno15.score)}</td>`).join('')}<td>${esc(c.pleno15.score)}</td></tr>`:''}<tr><td>Probabilitat de ${c.matches.length} encerts</td>${c.columns.map(col=>`<td>${pct(col.probability)}</td>`).join('')}<td>${d.extra===0?pct(c.coverage):'Agrupació ampliada'}</td></tr></tbody></table></div><p style="margin-top:16px"><b>Cobertura de les quatre columnes: ${pct(c.coverage)}</b></p><p class="meta">És la probabilitat estimada que una de les quatre encerti els ${c.matches.length} signes, assumint independència entre partits. Maximitza l’encert de tots els signes; no qualsevol premi ni la rendibilitat. Model experimental sense calibratge suficient.</p><p class="note">${d.extra===0?'La condensació amb dobles/triples s’expandeix exactament en '+d.expanded+' columnes: són les mateixes quatre apostes.':'La condensació s’expandeix en '+d.expanded+' columnes, '+d.extra+' més que les quatre seleccionades. Per jugar només quatre apostes, copia les columnes individuals.'}</p>${c.complete?`<p><b>Ple al 15 separat: ${esc(c.pleno15.score)}</b> · probabilitat ${pct(c.pleno15.probability)}. M = 3 o més gols. La cobertura dels 14 signes no inclou el Ple al 15.</p><p>Tancament oficial: <b>${date(c.deadline)}</b>. <a href="${esc(c.source)}" target="_blank" rel="noopener">Cupó SELAE</a> · <a href="${esc(r.official_coupon.deadline_source)}" target="_blank" rel="noopener">Avís de tancament</a></p>`:`<p class="note">${esc(c.reason)} No emplenis un cupó oficial amb aquesta taula parcial.</p>`}<details><summary>Probabilitats originals sense arrodonir</summary>${c.columns.map((col,i)=>`<p>Aposta ${i+1}: <code>${col.probability}</code> (${col.signs.join(' ')})</p>`).join('')}<p>Cobertura conjunta: <code>${c.coverage}</code>${c.complete?' · Ple al 15: <code>'+c.pleno15.probability+'</code>':''}.</p></details><p class="meta">Tall de dades: ${date(c.generated_from)}. Publicació: ${c.published_at?date(c.published_at):'pendent de confirmar'}. Es conserven les quatre columnes i les probabilitats en la revisió.</p></div>`;
}
function chosenRound(){const current=db.rounds[+$('#round').value];return +$('#version').value===0?current:current.history[+$('#version').value-1];}
function setVersions(){const r=db.rounds[+$('#round').value];$('#version').innerHTML=[r,...(r.history||[])].map((v,i)=>`<option value="${i}">${i===0?'Actual':'Anticipada'} · ${date(v.forecast_at)}</option>`).join('');}
function renderColumnResults(r){const c=r.coupon;if(!c?.columns.length)return '';const ms=c.matches.map(m=>r.matches.find(x=>x.home===m.home&&x.away===m.away));const eligible=m=>m&&m.forecast&&m.status==='final'&&new Date(r.forecast_at)<new Date(m.kickoff);const n=ms.filter(eligible).length;const pm=c.complete?r.matches.find(m=>m.home===c.pleno15.home&&m.away===c.pleno15.away):null;const pr=pm?.status==='final'&&pm.result?pm.result.map(v=>v>=3?'M':String(v)).join('-'):null;return `<div class="panel" style="margin-top:22px"><h2>Seguiment de les quatre columnes originals</h2><p>${n} / ${ms.length} resultats finals verificats. Publicació: ${c.published_at?date(c.published_at):'pendent'}.</p><div class="table-wrap"><table><thead><tr><th>Columna</th><th>Signes conservats</th><th>Encerts verificats</th></tr></thead><tbody>${c.columns.map((col,i)=>`<tr><td>Aposta ${i+1}</td><td style="white-space:nowrap">${col.signs.join(' ')}</td><td>${n?ms.reduce((hits,m,j)=>hits+(eligible(m)&&outcome(m)===col.signs[j]?1:0),0)+' / '+n:'Pendent'}</td></tr>`).join('')}</tbody></table></div><p class="meta">${c.complete?'Les 14 caselles del cupó s’avaluen separadament dels 16 pronòstics esportius. Ple al 15: '+(pr?pr+' · '+(pr===c.pleno15.score?'encert':'error'):'pendent de resultat final.'):'Cobertura parcial; aquests encerts no equivalen a un premi oficial.'}</p></div>`;}

function render(){const r=chosenRound(),ms=r.matches.filter(m=>m.forecast),t=r.metrics;$('#period').textContent=r.period;$('#updated').textContent='Darrera actualització: '+date(db.updated);const match=m=>{const p=m.forecast.percentages;return `<article class="match"><div class="match-top"><div><div class="meta">${esc(m.competition||'LALIGA EA SPORTS')} · ${date(m.kickoff)}</div><h3>${esc(m.home)} – ${esc(m.away)}</h3></div><div class="sign" aria-label="Signe recomanat ${m.forecast.sign}">${m.forecast.sign}</div></div><div class="prob">${['1','X','2'].map(s=>`<span class="${s===m.forecast.sign?'best':''}">${s}<b>${p[s]}%</b></span>`).join('')}</div><div class="bar" aria-hidden="true">${['1','X','2'].map(s=>`<i style="width:${p[s]}%"></i>`).join('')}</div><div class="meta" style="margin-top:10px">Marcadors: ${m.forecast.top_scores.map(x=>esc(x.score)).join(' · ')} · ${esc(m.confidence)}</div><details><summary>Factors i fonts</summary><p>${esc(m.note)}</p><p>Probabilitats originals: ${['1','X','2'].map(s=>s+': '+m.forecast.probabilities[s]).join(' · ')}</p>${m.sources.map((s,i)=>`<a href="${esc(s)}" target="_blank" rel="noopener">Font ${i+1}</a>`).join(' · ')}</details></article>`};
$('#pre').innerHTML=`${renderCoupon(r)}<div class="stats"><div class="stat"><strong>${ms.length}</strong><span>Partits amb previsió</span></div><div class="stat"><strong>${esc(r.model)}</strong><span>Versió congelada</span></div><div class="stat"><strong>${r.matches.length-ms.length}</strong><span>Partits fora d’avaluació</span></div></div><div class="note">${esc(r.warning)}</div><div class="layout"><div><div style="display:flex;justify-content:space-between;gap:15px;margin-bottom:14px"><h2>Pronòstics 1 · X · 2</h2><span class="tag">${esc(r.label)}</span></div><div class="panel matches">${ms.map(match).join('')}</div><p class="meta" style="margin-top:15px">Previsió emesa: ${date(r.forecast_at)}. Un marcador d’empat pot ser el més probable encara que el signe sigui 1: el signe suma totes les victòries possibles.</p></div><aside class="aside"><div class="panel side-block"><h2>El cicle de la jornada</h2><div class="step"><b>Dos dies abans · 10:00</b><small>Nova tasca, fonts actualitzades i previsió.</small></div><div class="step"><b>Durant la jornada</b><small>La previsió original queda congelada.</small></div><div class="step"><b>L’endemà del final · 10:00</b><small>Encerts, errors i revisió del model.</small></div><p class="meta">Hora de Madrid. ${esc(db.automation_note)}</p></div><div class="panel"><h2>Què inclou el model</h2><p>Gols, rendiment a casa i fora i avantatge local. Les baixes i el descans es documenten; la versió actual no en té un impacte numèric calibrat.</p><p class="meta">Encara sense calibratge històric, xG ni model individual dels golejadors.</p></div></aside></div>`;
const fmt=n=>n==null?'—':n.toFixed(3);$('#track').innerHTML=`<div class="stats"><div class="stat"><strong>${t.n?t.hits+' / '+t.n:'—'}</strong><span>Encerts de signe</span></div><div class="stat"><strong>${t.accuracy==null?'—':Math.round(t.accuracy*100)+'%'}</strong><span>Taxa d’encert</span></div><div class="stat"><strong>${t.n} / ${ms.length}</strong><span>Partits avaluats</span></div></div><div class="panel"><h2>Previsió contra resultat</h2><p class="sub">Només compten partits amb previsió publicada abans de començar i resultat final verificat.</p><div class="table-wrap"><table><thead><tr><th>Partit</th><th>Previsió</th><th>Resultat</th><th>Avaluació</th></tr></thead><tbody>${r.matches.map(m=>{let o=outcome(m);return `<tr><td>${esc(m.home)} – ${esc(m.away)}</td><td>${m.forecast?m.forecast.sign:'—'}</td><td>${m.result?m.result.join('–'):'Pendent'}</td><td>${!m.forecast?'Exclòs · sense previsió':o==='Pendent'?'Pendent':o===m.forecast.sign?'Encert':'Error'}</td></tr>`}).join('')}</tbody></table></div></div><div class="audit-grid"><div class="panel"><h2>Qualitat de les probabilitats</h2><p>Brier: <b>${fmt(t.brier)}</b> · Pèrdua logarítmica: <b>${fmt(t.logloss)}</b></p><p class="meta">Valors més baixos són millors. Brier multicategoria, escala 0–2. Amb pocs partits encara no es pot concloure que una versió sigui millor.</p></div><div class="panel"><h2>Revisió de la jornada</h2><p>${esc(r.review.summary)}</p><p class="meta">${esc(r.review.next)}</p></div></div><div class="panel" style="margin-top:22px"><h2>Registre de millores</h2>${r.review.changes.length?r.review.changes.map(c=>`<p>${esc(c)}</p>`).join(''):'<div class="empty">Encara no hi ha canvis validats. Es documentaran la hipòtesi, les proves i la decisió abans d’aplicar una nova versió.</div>'}</div>`;$('#track').innerHTML+=renderColumnResults(r);
}
$('#round').addEventListener('change',()=>{setVersions();render()});$('#version').addEventListener('change',render);const tabs=[...document.querySelectorAll('[role=tab]')];function selectTab(i){history.replaceState(null,'',i===1?'#track':'#pre');tabs.forEach((b,j)=>{b.setAttribute('aria-selected',j===i);b.tabIndex=j===i?0:-1;$('#'+b.getAttribute('aria-controls')).hidden=j!==i})}tabs.forEach((b,i)=>{b.addEventListener('click',()=>selectTab(i));b.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let j=e.key==='Home'?0:e.key==='End'?1:1-i;selectTab(j);tabs[j].focus()}})});setVersions();render();selectTab(location.hash==='#track'?1:0);
</script></body></html>
