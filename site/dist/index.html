function monitoring(r){return r.monitoring_notice?`<div class="note"><strong>Seguiment de la jornada</strong><p>${esc(r.monitoring_notice)}</p>${(r.monitoring_sources||[]).map((s,i)=>`<a href="${esc(s)}" target="_blank" rel="noopener">Font del seguiment ${i+1}</a>`).join(' · ')}</div>`:'';}

function condensed(c){const signs=c.matches.map((_,i)=>['1','X','2'].filter(s=>c.columns.some(col=>col.signs[i]===s)).join(''));const expanded=signs.reduce((n,s)=>n*s.length,1);return {signs,expanded,extra:expanded-c.columns.length};}
function renderCoupon(r){
const c=r.coupon;if(!c)return '';const pct=p=>new Intl.NumberFormat('ca-ES',{maximumSignificantDigits:4}).format(p*100)+'%';const d=condensed(c),ordered=c.complete||c.provisional_coupon;
if(!c.columns.length)return '<div class="panel"><h2>Quatre combinacions</h2><p>Encara no hi ha probabilitats verificades.</p></div>';
const title=c.provisional_coupon?'4 combinacions provisionals':c.complete?'Les teves 4 apostes':'4 combinacions parcials';
const timing=c.complete?`<p>Tancament oficial: <b>${date(c.deadline)}</b>. <a href="${esc(r.official_coupon.deadline_source)}" target="_blank" rel="noopener">Avís oficial</a></p>`:c.provisional_coupon?`<div class="note"><b>Termini previst, pendent de confirmació SELAE: ${date(c.deadline_expected)}</b><p>L’avís específic de tancament encara no s’ha verificat. El primer partit del cupó comença el 31/10 a les 14:00. Confirma el límit del teu canal; prepara l’enviament abans de divendres 30/10 al vespre.</p><a href="${esc(r.official_coupon.deadline_check_source)}" target="_blank" rel="noopener">Avisos oficials de SELAE</a></div>`:`<p class="note">${esc(c.reason)}</p>`;
return `<div class="panel" style="margin:20px 0"><div class="match-top"><h2>${title}</h2><span class="tag">${ordered?'SELAE · jornada '+r.official_coupon.number:'Cupó incomplet'}</span></div>${c.provisional_coupon?`<p class="note">${esc(c.reason)} Aquest esborrany no es presenta com una Quiniela completa confirmada.</p>`:''}<p>${ordered?esc(r.official_coupon.composition_note||'Ordre del cupó oficial verificat.'):'Només cobreix '+c.matches.length+' partits amb previsió.'}</p>${timing}<div class="table-wrap"><table><caption class="meta">${ordered?'Ordre del cupó oficial':'Ordre de la previsió parcial'} · 1 local · X empat · 2 visitant · Desplaça lateralment per veure totes les columnes.</caption><thead><tr><th>Partit</th>${c.columns.map((_,i)=>`<th>Columna ${i+1}</th>`).join('')}<th>Condensació</th></tr></thead><tbody>${c.matches.map((m,i)=>`<tr><td>${i+1}. ${esc(m.home)} – ${esc(m.away)}</td>${c.columns.map(col=>`<td><b>${col.signs[i]}</b></td>`).join('')}<td>${d.signs[i]}</td></tr>`).join('')}${ordered?`<tr><td>Ple al 15 · ${esc(c.pleno15.home)} – ${esc(c.pleno15.away)}</td>${c.columns.map(()=>`<td>${esc(c.pleno15.score)}</td>`).join('')}<td>${esc(c.pleno15.score)}</td></tr>`:''}<tr><td>Probabilitat de ${c.matches.length} encerts</td>${c.columns.map(col=>`<td>${pct(col.probability)}</td>`).join('')}<td>${d.extra===0?pct(c.coverage):'Agrupació ampliada'}</td></tr></tbody></table></div><p><b>Cobertura de les quatre columnes: ${pct(c.coverage)}</b></p><p class="meta">Probabilitat estimada que una columna encerti tots els signes, assumint independència. No és una probabilitat de premi ni de benefici; model experimental.</p><p class="note">${d.extra===0?'La condensació s’expandeix exactament en quatre columnes.':'La condensació s’expandeix en '+d.expanded+' columnes, '+d.extra+' més que les quatre seleccionades. Les columnes individuals són les quatre calculades.'}</p>${ordered?`<p>Ple al 15 separat: <b>${esc(c.pleno15.score)}</b> · probabilitat ${pct(c.pleno15.probability)}. M = 3 o més gols.</p><p><a href="${esc(c.source)}" target="_blank" rel="noopener">Cupó oficial SELAE</a></p>`:''}<details><summary>Probabilitats originals sense arrodonir</summary>${c.columns.map((col,i)=>`<p>Columna ${i+1}: <code>${col.probability}</code> (${col.signs.join(' ')})</p>`).join('')}</details><p class="meta">Tall de dades: ${date(c.generated_from)}. Publicació: ${c.published_at?date(c.published_at):'pendent de confirmar'}. Les probabilitats i columnes publicades es conserven.</p></div>`;
}
function chosenRound(){const current=db.rounds[+$('#round').value];return +$('#version').value===0?current:current.history[+$('#version').value-1];}
function setVersions(){const r=db.rounds[+$('#round').value];$('#version').innerHTML=[r,...(r.history||[])].map((v,i)=>`<option value="${i}">${i===0?'Actual':'Anticipada'} · ${date(v.forecast_at)}</option>`).join('');}
function renderColumnResults(r){
const c=r.coupon;if(!c?.columns.length)return '';
const ms=c.matches.map(m=>r.matches.find(x=>x.home===m.home&&x.away===m.away));
const official=r.coupon_results;
const resolved=ms.map((m,i)=>{const o=official?.signs?.[String(i+1)];if(c.complete&&o?.status==='verified'&&o.source&&['1','X','2'].includes(o.sign))return o.sign;return m?.forecast&&m.status==='final'&&m.result&&new Date(r.forecast_at)<new Date(m.kickoff)?outcome(m):null;});
const n=resolved.filter(Boolean).length;
const pm=c.complete?r.matches.find(m=>m.home===c.pleno15.home&&m.away===c.pleno15.away):null;
const po=official?.pleno15;
const pr=po?.status==='verified'&&po.source?po.score:pm?.status==='final'&&pm.result?pm.result.map(v=>v>=3?'M':String(v)).join('-'):null;
return `<div class="panel" style="margin-top:22px"><h2>Seguiment de les quatre columnes originals</h2><p>${n} / ${ms.length} caselles amb resultat disponible. Publicació: ${c.published_at?date(c.published_at):'pendent'}.</p><div class="table-wrap"><table><thead><tr><th>Columna</th><th>Signes conservats</th><th>Encerts verificats</th><th>Premi brut teòric</th></tr></thead><tbody>${c.columns.map((col,i)=>`<tr><td>Aposta ${i+1}</td><td style="white-space:nowrap">${col.signs.join(' ')}</td><td>${n?resolved.reduce((hits,s,j)=>hits+(s===col.signs[j]?1:0),0)+' / '+n:'Pendent'}</td><td>${prizeText(r,i)}</td></tr>`).join('')}</tbody></table></div><p class="meta">${c.complete?'Les 14 caselles s’avaluen separadament dels '+r.matches.filter(m=>m.forecast).length+' pronòstics esportius. Ple al 15: '+(pr?esc(pr)+' · '+(pr===c.pleno15.score?'encert':'error'):'pendent de resultat final.'):'Cobertura parcial; aquests encerts no equivalen a un premi oficial.'}</p>${official?`<p class="meta"><a href="${esc(official.source)}" target="_blank" rel="noopener">Comprovació SELAE</a> · ${date(official.checked_at)}. La resolució SELAE d’un partit suspès només compta per al cupó; queda fora de les mètriques esportives. ${official.status==='complete'?'Les 14 caselles i el Ple al 15 estan confirmats per SELAE.':'La resta s’avalua amb resultats finals de LALIGA, a l’espera de la confirmació completa de SELAE.'}</p>${[...(official.special_cases||[]),...(official.pending_special_cases||[])].map(x=>`<p class="note">Casella ${x.position}: ${esc(x.match)} · ${esc(x.note)}</p>`).join('')}`:''}</div>`;
}



const money=cents=>new Intl.NumberFormat('ca-ES',{style:'currency',currency:'EUR'}).format(cents/100);
function prizeText(r,i){const p=r.prize_evaluation;if(p?.status==='not_evaluable')return 'No avaluable';const col=p?.columns?.[i];return col?.amount_cents==null?'Pendent':money(col.amount_cents);}
function renderPrizes(r){const p=r.prize_evaluation;if(!p)return '';return `<div class="panel" style="margin-top:22px"><h2>Premi monetari de les columnes</h2>${p.status==='not_evaluable'?`<p>${esc(p.reason)}</p>`:`<p><b>Total brut teòric de les quatre columnes: ${p.total_cents==null?'pendent de resultats o escrutini':money(p.total_cents)}</b></p><p class="meta">${esc(p.note)}</p>`}${p.source?`<p><a href="${esc(p.source)}" target="_blank" rel="noopener">Escrutini oficial SELAE</a> · verificat ${date(p.checked_at)}.</p>`:''}${r.prize_table?.status==='verified'?`<details><summary>Imports oficials per categoria i aposta simple</summary><div class="table-wrap"><table><thead><tr><th>Categoria</th><th>Premi brut</th></tr></thead><tbody>${Object.entries(r.prize_table.categories_cents).map(([hits,cents])=>`<tr><td>${hits} encerts</td><td>${money(cents)}</td></tr>`).join('')}<tr><td>Ple al 15 · complement a 14 encerts</td><td>${money(r.prize_table.pleno15_cents)}</td></tr></tbody></table></div></details>`:''}</div>`;}

function columnSummary(r){
 const c=r.coupon;if(!c?.columns?.length)return null;
 const published=c.published_at||r.forecast_published_at||r.forecast_at;
 const resolved=c.matches.map((cm,i)=>{
  const m=r.matches.find(x=>x.home===cm.home&&x.away===cm.away);
  if(!m||!published||!m.kickoff||new Date(published)>=new Date(m.kickoff))return null;
  const official=r.coupon_results?.signs?.[String(i+1)];
  if(c.complete&&official?.status==='verified'&&official.source&&['1','X','2'].includes(official.sign))return official.sign;
  return m.forecast&&m.status==='final'&&m.result?outcome(m):null;
 });
 const n=resolved.filter(Boolean).length;
 const hits=c.columns.map(col=>resolved.reduce((sum,s,i)=>sum+(s&&s===col.signs[i]?1:0),0));
 return {n,size:c.matches.length,hits,best:Math.max(...hits),complete:c.complete&&n===14&&c.matches.length===14};
}
function renderAllColumns(){
 return `<div class="panel" style="margin-top:22px"><h2>Les quatre columnes · comparació per jornada</h2><p>Es conserven les columnes originals. Els encerts d’una mateixa columna es compten separadament de la taxa global per partit.</p><div class="table-wrap"><table><thead><tr><th>Jornada</th><th>Columna 1</th><th>Columna 2</th><th>Columna 3</th><th>Columna 4</th><th>Millor columna</th><th>Estat</th></tr></thead><tbody>${db.rounds.map(r=>{const c=columnSummary(r);if(!c)return '';return `<tr><td>${r.number}</td>${[0,1,2,3].map(i=>`<td>${c.hits[i]==null?'—':c.hits[i]+' / '+c.n}${c.hits[i]==null?'':'<br><small>'+prizeText(r,i)+'</small>'}</td>`).join('')}<td><b>${c.best} / ${c.n}</b></td><td>${c.complete?(c.best>=10?'10 o més encerts · consulta l’import':'Menys de 10 encerts'):'Parcial · '+c.n+' de '+c.size+' caselles'}</td></tr>`}).join('')}</tbody></table></div><p class="meta">Una taula parcial no confirma cap premi. El Ple al 15 s’avalua a part. Els possibles imports depenen de l’escrutini SELAE; assolir 10 encerts no garanteix un import positiu.</p></div>`;
}
function renderResearchLink(){return `<div class="panel" style="margin-top:22px"><h2>Millores comprovades amb dades històriques</h2><p>Prova reservada 2025/26: a Primera, el candidat encerta 204 de 380 partits (53,7%), davant dels 191 (50,3%) del model actual. També millora Brier i pèrdua logarítmica. A Segona no millora: es conserva el model actual.</p><p>Model de Primera preparat per a previsions noves amb historial verificat. Liga F continua sense validació pròpia. Aquests resultats simulats no se sumen als encerts publicats.</p><a href="model.html">Consulta el protocol, les referències i la incertesa →</a></div>`;}

function render(){const r=chosenRound(),ms=r.matches.filter(m=>m.forecast),t=r.metrics;$('#period').textContent=r.period;$('#updated').textContent='Darrera actualització: '+date(db.updated);const match=m=>{const p=m.forecast.percentages;return `<article class="match"><div class="match-top"><div><div class="meta">${esc(m.competition||'LALIGA EA SPORTS')} · ${date(m.kickoff)}${m.status==='suspended'?' · data inicial':''}</div><h3>${esc(m.home)} – ${esc(m.away)}</h3></div><div class="sign" aria-label="Signe recomanat ${m.forecast.sign}">${m.forecast.sign}</div></div><div class="prob">${['1','X','2'].map(s=>`<span class="${s===m.forecast.sign?'best':''}">${s}<b>${p[s]}%</b></span>`).join('')}</div><div class="bar" aria-hidden="true">${['1','X','2'].map(s=>`<i style="width:${p[s]}%"></i>`).join('')}</div><div class="meta" style="margin-top:10px">Marcadors: ${m.forecast.top_scores.map(x=>esc(x.score)).join(' · ')} · ${esc(m.confidence)}</div><p class="meta">${esc(matchState(m))}${m.result_source?` · <a href="${esc(m.result_source)}" target="_blank" rel="noopener">Resultat oficial</a>`:''}</p><details><summary>Factors i fonts</summary><p>${esc(m.note)}</p><p>Probabilitats originals: ${['1','X','2'].map(s=>s+': '+m.forecast.probabilities[s]).join(' · ')}</p>${m.sources.map((s,i)=>`<a href="${esc(s)}" target="_blank" rel="noopener">Font ${i+1}</a>`).join(' · ')}</details></article>`};
$('#pre').innerHTML=`${monitoring(r)}${renderCoupon(r)}<div class="stats"><div class="stat"><strong>${ms.length}</strong><span>Partits amb previsió</span></div><div class="stat"><strong>${esc(r.model)}</strong><span>Versió congelada</span></div><div class="stat"><strong>${r.matches.length-ms.length}</strong><span>Partits fora d’avaluació</span></div></div><div class="note">${esc(r.warning)}</div><div class="layout"><div><div style="display:flex;justify-content:space-between;gap:15px;margin-bottom:14px"><h2>Pronòstics 1 · X · 2</h2><span class="tag">${esc(r.label)}</span></div><div class="panel matches">${ms.map(match).join('')}</div><p class="meta" style="margin-top:15px">Previsió emesa: ${date(r.forecast_at)}. Un marcador d’empat pot ser el més probable encara que el signe sigui 1: el signe suma totes les victòries possibles.</p></div><aside class="aside"><div class="panel side-block"><h2>El cicle de la jornada</h2><div class="step"><b>Dos dies abans · 10:00</b><small>Nova tasca, fonts actualitzades i previsió.</small></div><div class="step"><b>Durant la jornada</b><small>La previsió original queda congelada.</small></div><div class="step"><b>L’endemà del final · 10:00</b><small>Encerts, errors i revisió del model.</small></div><p class="meta">Hora de Madrid. ${esc(db.automation_note)}</p></div><div class="panel"><h2>Què inclou el model</h2><p>Gols, rendiment a casa i fora i avantatge local. Les baixes i el descans es documenten; la versió actual no en té un impacte numèric calibrat.</p><p class="meta">Les previsions publicades conserven el model original. L’avaluació històrica dels candidats és a l’apartat Avaluació; xG i model individual dels golejadors continuen pendents.</p></div></aside></div>`;
const fmt=n=>n==null?'—':n.toFixed(3);$('#track').innerHTML=`<div class="panel" style="margin-bottom:22px"><h2>Taxa d’encert acumulada</h2><p style="font-size:1.4rem"><b>${(db.aggregate_metrics.accuracy*100).toLocaleString('ca-ES',{maximumFractionDigits:1})}% · ${db.aggregate_metrics.hits} encerts de ${db.aggregate_metrics.n} partits</b></p><p class="meta">Signe principal 1/X/2 de les previsions originals. Només finals verificats amb previsió anterior a l’inici. Les versions històriques i el Ple al 15 no se sumen. Inclou jornades parcials; mostra encara petita.</p><div class="table-wrap"><table><thead><tr><th>Jornada</th><th>Encerts / avaluats</th><th>Taxa d’encert</th></tr></thead><tbody>${db.rounds.map(x=>`<tr><td>${x.number}</td><td>${x.metrics.hits} / ${x.metrics.n}</td><td>${x.metrics.accuracy==null?'—':(x.metrics.accuracy*100).toLocaleString('ca-ES',{maximumFractionDigits:1})+'%'}</td></tr>`).join('')}</tbody></table></div></div>${monitoring(r)}<div class="stats"><div class="stat"><strong>${t.n?t.hits+' / '+t.n:'—'}</strong><span>Encerts de signe</span></div><div class="stat"><strong>${t.accuracy==null?'—':Math.round(t.accuracy*100)+'%'}</strong><span>Taxa d’encert</span></div><div class="stat"><strong>${t.n} / ${ms.length}</strong><span>Partits avaluats</span></div></div><div class="panel"><h2>Previsió contra resultat</h2><p class="sub">Només compten partits amb previsió publicada abans de començar i resultat final verificat.</p><div class="table-wrap"><table><thead><tr><th>Partit</th><th>Previsió</th><th>Resultat</th><th>Avaluació</th></tr></thead><tbody>${r.matches.map(m=>{let o=outcome(m);return `<tr><td>${esc(m.home)} – ${esc(m.away)}</td><td>${m.forecast?m.forecast.sign:'—'}</td><td>${esc(matchState(m))}</td><td>${!m.forecast?'Exclòs · sense previsió':o==='Pendent'?(m.status==='suspended'?'Pendent · suspès':'Pendent'):o===m.forecast.sign?'Encert':'Error'}</td></tr>`}).join('')}</tbody></table></div></div><div class="audit-grid"><div class="panel"><h2>Qualitat de les probabilitats</h2><p>Brier: <b>${fmt(t.brier)}</b> · Pèrdua logarítmica: <b>${fmt(t.logloss)}</b></p><p class="meta">Valors més baixos són millors. Brier multicategoria, escala 0–2. Amb pocs partits encara no es pot concloure que una versió sigui millor.</p></div><div class="panel"><h2>Revisió de la jornada</h2><p>${esc(r.review.summary)}</p><p class="meta">${esc(r.review.next)}</p></div></div><div class="panel" style="margin-top:22px"><h2>Registre de millores</h2>${r.review.changes.length?r.review.changes.map(c=>`<p>${esc(c)}</p>`).join(''):'<div class="empty">Encara no hi ha canvis validats. Es documentaran la hipòtesi, les proves i la decisió abans d’aplicar una nova versió.</div>'}</div>`;$('#track').innerHTML+=renderColumnResults(r)+renderPrizes(r)+renderAllColumns()+renderResearchLink();
}
$('#round').addEventListener('change',()=>{setVersions();render()});$('#version').addEventListener('change',render);const tabs=[...document.querySelectorAll('[role=tab]')];function selectTab(i){history.replaceState(null,'',i===1?'#track':'#pre');tabs.forEach((b,j)=>{b.setAttribute('aria-selected',j===i);b.tabIndex=j===i?0:-1;$('#'+b.getAttribute('aria-controls')).hidden=j!==i})}tabs.forEach((b,i)=>{b.addEventListener('click',()=>selectTab(i));b.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let j=e.key==='Home'?0:e.key==='End'?1:1-i;selectTab(j);tabs[j].focus()}})});setVersions();render();selectTab(location.hash==='#track'?1:0);
</script></body></html>
